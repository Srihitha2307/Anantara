# Render.com blueprint: one Docker service serves the website AND the API.
# Free plan = 512 MB RAM. Models are loaded lazily, so a normal upload fits;
# a very large spectrum/light curve may need a paid instance.
services:
  - type: web
    name: anantara-ai
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
